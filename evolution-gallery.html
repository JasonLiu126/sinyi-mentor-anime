<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全角色五星進化圖鑑</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172b24;font-family:system-ui,sans-serif}header{background:#008744;color:#fff;padding:20px;position:sticky;top:0;z-index:2}header>div,main{max-width:1040px;margin:auto}h1{font-size:22px;margin:0 0 8px}p{font-size:13px;margin:5px 0}select{width:100%;max-width:360px;padding:9px;margin-top:8px;border:2px solid #163c2a;border-radius:9px;color:#172b24;background:white}main{padding:16px}section{border:2px solid #172b24;box-shadow:3px 3px #172b24;border-radius:16px;background:white;padding:14px;margin-bottom:18px}h2{font-size:16px;margin:0 0 10px}.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.stage{min-width:0;text-align:center;border:1px solid #d1e3d8;border-radius:10px;padding:8px 4px;background:linear-gradient(135deg,#fff,#f2f8f4)}.stage > img{width:100%;height:155px;object-fit:contain}.stage > svg{width:100%;height:155px;display:block}.stage b{display:block;font-size:12px;line-height:18px}.stage small{color:#6a7b70;font-size:11px}a{color:inherit}section[hidden]{display:none}@media(max-width:500px){header{padding:14px}main{padding:10px}section{padding:9px}.stages{gap:3px}.stage{padding:5px 1px}.stage > svg,.stage > img{height:94px}.stage b{font-size:10px}.stage small{font-size:10px}}
</style></head><body><header><div><h1>全角色五星進化圖鑑</h1><p id="count">服裝、姿勢、配件與體態，隨星等逐步進化。</p><label>查看角色 <select id="filter"><option value="all">全部角色</option><option value="tony">托尼宇宙</option><option value="super">超業</option><option value="family">傳承</option></select></label><p><a href="./">返回遊戲</a> · 此頁僅供預覽，不會更改收藏或消耗碎片。</p></div></header><main id="gallery"></main>
<script src="./character-policy.js"></script><script src="./evolution-data.js"></script><script src="./gallery-extra-data.js"></script><script>
const catalog = globalThis.characterEvolutionCatalog;
const entries = Object.entries(catalog).filter(([id])=>!globalThis.hideChenCharacters||!id.startsWith('fig_'));
document.getElementById('count').textContent = `${entries.length} 款角色 × 5 星，共 ${entries.length*5} 款造型。`;
const filter = document.getElementById('filter');
const gallery = document.getElementById('gallery');
entries.forEach(([id,art])=>{
  const option=document.createElement('option');option.value=id;option.textContent=art.name;filter.appendChild(option);
  const section=document.createElement('section');section.dataset.id=id;section.dataset.universe=id.startsWith('fig_')?'chen':id.startsWith('tony_')?'tony':id.startsWith('heir_')?'family':'super';
  const width=art.width/3,height=art.height/2;
  section.innerHTML=`<h2>${art.name}</h2><div class="stages">${art.names.map((name,index)=>{const [x,y,w,h]=art.frames?.[index]??[index%3*width,Math.floor(index/3)*height,width,height];if(art.files)return `<div class="stage"><img src="./${art.files[index]}" alt="${art.name} ${index+1} 星 ${name}"><small>${'★'.repeat(index+1)}${'☆'.repeat(4-index)}</small><b>${name}</b></div>`;return `<div class="stage"><svg role="img" aria-label="${art.name} ${index+1} 星 ${name}" viewBox="0 0 ${w} ${h}"><svg width="${w}" height="${h}" viewBox="${x} ${y} ${w} ${h}" style="overflow:hidden"><image href="./${art.file}" width="${art.width}" height="${art.height}" /></svg></svg><small>${'★'.repeat(index+1)}${'☆'.repeat(4-index)}</small><b>${name}</b></div>`;}).join('')}</div>`;
  gallery.appendChild(section);
});
filter.addEventListener('change',()=>{for(const section of gallery.children)section.hidden=filter.value!=='all'&&filter.value!==section.dataset.id&&filter.value!==section.dataset.universe;});
</script></body></html>
